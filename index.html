<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OptimalDevs is a lean dev team helping small businesses get online with custom websites, online presence, and infrastructure." />

    <!-- Fonts are self-hosted via @fontsource (see src/index.css). BRAND.md
         hard rule 5: never let the mono face fall back. This also removes the
         render-blocking Google Fonts request flagged in #45. -->

    <title>OptimalDevs | Web development for small businesses</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OptimalDevs" />
    <meta property="og:title" content="OptimalDevs | Web development for small businesses" />
    <meta property="og:description" content="Websites and bespoke software for small businesses. Design, development, and the infrastructure to back it up." />
    <meta property="og:url" content="https://optimaldevs.tech/" />
    <meta property="og:image" content="https://optimaldevs.tech/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OptimalDevs — websites, software, security" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Organization schema. Deliberately narrow: no telephone, no postal
         address, no aggregateRating, because none of those exist yet and
         inventing them is how a site earns a manual action. Add sameAs
         entries as the company's profiles go live. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "OptimalDevs",
        "url": "https://optimaldevs.tech/",
        "logo": "https://optimaldevs.tech/og.png",
        "description": "Websites and bespoke software for small businesses. Design, development, and the infrastructure to back it up.",
        "slogan": "websites \u00b7 software \u00b7 security",
        "foundingDate": "2025-10",
        "areaServed": {
          "@type": "City",
          "name": "Denver",
          "containedInPlace": { "@type": "State", "name": "Colorado" }
        },
        "knowsAbout": [
          "Web development",
          "Local SEO",
          "Cloud hosting",
          "DevOps",
          "Web application security"
        ],
        "sameAs": ["https://github.com/OptimalDevTeam"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
